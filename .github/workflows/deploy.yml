# Publication : à chaque push sur `main` (fusion de `Work`), construit le site (Eleventy),
# lance les tests, puis envoie _site/ sur l'hébergement OVH par FTP.
# Secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD : définis dans l'environnement GitHub `github-pages`
# (Settings → Environments), d'où `environment:` ci-dessous ; branches autorisées : main et Work.
# Variable facultative : FTP_DIR (dossier du site sur le FTP, par défaut /www/).
# Variable facultative : FTP_PROTOCOL (ftp par défaut ; ftps si l'hébergeur le permet).
name: Publication

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # Donne accès aux secrets FTP de cet environnement
    environment: github-pages
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # En cas d'échec, la fin du journal est remontée en annotation (visible dans le résumé du run)
      - name: Build + tests
        run: |
          set +e
          npm test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::error title=npm test::$(tail -n 40 test.log | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')"
          fi
          exit "$status"

      # N'envoie que les fichiers modifiés (état mémorisé sur le serveur dans .ftp-deploy-sync-state.json)
      - name: Envoi FTP vers OVH
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # OVH mutualisé : FTPS non pris en charge (« 500 This security scheme is not implemented »)
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./_site/
          server-dir: ${{ vars.FTP_DIR || '/www/' }}

      # Signale les pages à Bing (qui alimente ChatGPT et Copilot) via IndexNow ; un échec ne bloque rien
      - name: Signalement IndexNow
        run: node scripts/indexnow.mjs
        continue-on-error: true
