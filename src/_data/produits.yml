# Produits à vendre (page market.html + une page par produit dans /vente/).
# Ordre d'affichage = ordre du fichier. Produit vendu : supprimer son bloc.
#
#   id           numéro unique, jamais réutilisé (plus grand id + 1) ; sert dans l'URL
#   nom          titre affiché
#   etat         restaure (prêt à l'emploi) | a-renover (à personnaliser)
#   description  texte libre ; chaque retour à la ligne est conservé
#   photos       chemins dans src/resources/, la première sert de vignette

