# Lexique de la page services.html : relie les mots du grand public aux termes du métier
# (utile aux visiteurs comme aux moteurs de recherche). Définitions générales du métier.

- terme: Réfection
  aussi: refaire, rénover, restaurer un fauteuil
  definition: Remise à neuf complète d'un siège, de la structure intérieure jusqu'au tissu.
- terme: Garnissage
  aussi: rembourrage, regarnir, l'assise qui s'affaisse
  definition: Tout ce qui donne au siège son confort et sa forme sous le tissu (sangles, ressorts, rembourrage).
- terme: Couverture
  aussi: recouvrir, retapisser, changer le tissu
  definition: Pose du tissu final sur le siège, dans le tissu de votre choix.
- terme: Dégarnissage
  aussi: enlever l'ancien tissu, démonter
  definition: Retrait de l'ancien tissu et de l'ancien rembourrage avant la remise en état.
- terme: Sanglage
  aussi: sangles, fond du siège
  definition: Bandes tendues sous l'assise ou le dossier, qui supportent le rembourrage.
- terme: Passementerie
  aussi: galon, clous décoratifs, finitions
  definition: Galons, franges, cordons ou clous qui cachent les bords du tissu et terminent le siège.
