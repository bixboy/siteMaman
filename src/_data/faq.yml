# Questions fréquentes (page services.html + données FAQPage pour Google et les assistants IA).
# Formuler les questions comme un client les taperait ; réponses courtes et exactes, sans promesse non tenue.

- question: "Combien coûte la réfection d'un fauteuil ?"
  reponse: >-
    Le prix dépend du siège, de son état et du tissu choisi. Je vous propose un devis gratuit, établi après avoir
    vu le fauteuil.
- question: "Mon fauteuil est abîmé (assise affaissée, tissu déchiré, rembourrage tassé) : peut-on le sauver ?"
  reponse: >-
    C'est justement le travail d'une tapissière d'ameublement : remettre en état l'intérieur du siège (garnissage)
    et le recouvrir d'un nouveau tissu. Contactez-moi pour en parler ; le devis est gratuit.
- question: "Vous déplacez-vous à domicile ?"
  reponse: >-
    Oui. J'interviens à domicile à Caen et dans tout le Calvados : il n'y a pas d'atelier recevant du public.
- question: "Quels meubles restaurez-vous ?"
  reponse: >-
    Les fauteuils (bergères, cabriolets, Voltaire, crapauds, fauteuils bridge…), les chaises, les canapés,
    ainsi que les coussins.
- question: "Puis-je choisir le tissu de mon fauteuil ?"
  reponse: >-
    Oui. Je travaille avec les tissus et passementeries de grandes maisons (Casal, Lelièvre, Pierre Frey,
    JAB Anstoetz, Romo…) et vous aide à choisir.
- question: "Où faire refaire un fauteuil près de Caen ?"
  reponse: >-
    Main é Merveille, tapissière d'ameublement à Caen, restaure fauteuils, chaises et canapés à domicile
    dans tout le Calvados. Contact par téléphone ou par email (page Contact) ; devis gratuit.
- question: "Vendez-vous des fauteuils ?"
  reponse: >-
    Oui : des fauteuils et chaises déjà restaurés, prêts à l'emploi, et d'autres à rénover selon vos goûts.
    Ils sont présentés sur la page « Fauteuils à vendre ».
